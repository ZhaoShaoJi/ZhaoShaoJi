* {

}

body {

/* 左側選單格子（改為淺藍色背景） */

  width: 20%;

}

  padding: 8px;
  margin-top: 7px;
  display: block;
  width: 100%;
  color: #000000;
  text-decoration: none;
}

.menu a:hover {
  background-color: #89b4f8;
}

/* 中間內文區塊 */
.main {
  float: left;
  width: 60%;
  padding: 0 20px;
  text-align: center;
  background-color: rgba(255, 255, 255, 0.85);

  margin-top: 7px;
}

/* 右側 About 區塊（改為淺藍色背景） */
.right {
  background-color: #a1c4fd;
  float: left;
  width: 20%;
  padding: 15px;
  margin-top: 7px;
  text-align: center;
}

/* 底部頁尾（改為淺藍色背景） */
.footer {
  background-color: #a1c4fd;
  text-align: center;
  padding: 10px;
  margin-top: 7px;
  clear: both;
}

.footer a {
  color: #000000;
  text-decoration: none;
  font-weight: bold;
}

.footer a:hover {
  text-decoration: underline;
}

@media only screen and (max-width: 900px) {
  /* For mobile phones / smaller screens: */
  .menu, .main, .right {
    width: 100%;
  }
  .content-flex {
    flex-direction: column !important;
    align-items: center;
  }
}
</style>
</head>

<!-- Chart.js 引入與設定 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
<script>
const xValues = ["gawr", "gura", "sameko", "saba", "cute"];
const yValues = [100, 100, 100, 100, 100];
const barColors = ["red", "green", "blue", "orange", "brown"];

const ctx = document.getElementById('myChart');

new Chart(ctx, {
  type: "bar",
  data: {
    labels: xValues,
    datasets: [{
      backgroundColor: barColors,
      data: yValues
    }]
  },
  options: {
    responsive: true,
    devicePixelRatio: window.devicePixelRatio > 1 ? window.devicePixelRatio * 2 : 2,
    scales: {
      y: {
        beginAtZero: true,
        max: 100
      }
    },
    plugins: {
      legend: {display: false},
      title: {
        display: true,
        text: "可愛程度",
        font: {size: 20}
      }
    }
  }
});
</script>
